function render(){

bES.className=L=="es"?"on":"";bEN.className=L=="en"?"on":"";bFI.className=L=="fi"?"on":"";

sos.innerHTML=d.sos.map(function(x){return '<span><b>'+x[0]+'</b> '+x[1]+'</span>'}).join("");
hWho.textContent=d.hWho;
who.innerHTML=d.who.map(function(x,i){return '<div class="c t'+[0,1,3][i]+'">'+ic(x[0])+'<b>'+x[1]+'</b>'+x[2]+'</div>'}).join("");
hPick.textContent=d.hPick;
tabs.innerHTML=d.topics.map(function(x,i){return '<button class="tab t'+i+(i==T?" on":"")+'" onclick="pick('+i+')">'+ic(K[i])+'<b>'+x.n+'</b></button>'}).join("");
var fl=t.s.map(function(x,i){var c=i==S?" on":(done[T+"-"+i]?" done":"");return (i?'<div class="line"></div>':"")+'<button class="node'+c+'" onclick="go('+i+')" aria-label="'+d.st+" "+(i+1)+'">'+ic(x[0])+'</button>'}).join("");
var ck=t.chk.map(function(x,i){return '<label><input type="checkbox" onchange="tg('+i+')"'+(chk[T+"-"+i]?" checked":"")+'>'+x+'</label>'}).join("");
panel.className="panel t"+T;

panel.innerHTML='<h3 class="ttl">'+t.n+'</h3><div class="bar"><i style="width:'+Math.round((S+1)/t.s.length*100)+'%"></i></div><div class="flow">'+fl+'</div>'
+'<div class="step '+st[2]+'"><div class="art">'+ic(st[0])+'</div><div><span class="tag">'+d.by[st[2]]+'</span><h3>'+d.st+" "+(S+1)+" "+d.of+" "+t.s.length+": "+st[1]+'</h3><p>'+st[3]+'</p><div class="tip">💡 '+st[4]+'</div>'+(st[5]?'<button class="mapbtn t'+st[5]+'" onclick="goMap(\''+st[5]+'\')">'+d["map"+st[5]]+'</button>':'')+'</div></div>'
+'<div class="nav"><button class="sec" onclick="go('+(S-1)+')"'+(S==0?" disabled":"")+'>'+d.prev+'</button>'
+(S==t.s.length-1?'<button onclick="S=0;done={};render()">'+d.reset+'</button>':'<button onclick="go('+(S+1)+')">'+d.next+'</button>')+'</div>'
+'<div class="chk"><b>✅ '+d.have+'</b><div class="hint">'+d.hint+'</div><div class="lst">'+ck+'</div></div>';
renderMap();renderArr();updCap();bPres.textContent=PL[L].pres;hGl.textContent=d.hGl;
gl.innerHTML=d.gl.map(function(x,i){return '<details class="t'+[0,1,2,4][i]+'"><summary>'+x[0]+'</summary>'+x[1]+'</details>'}).join("");
}
